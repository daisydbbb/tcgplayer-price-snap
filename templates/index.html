<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCGplayer Price Snap</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d8d8dc;
    --text: #1b1b1f;
    --muted: #6b6b73;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #b3261e;
    --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 960px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 16px;
  }
  .columns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    flex: 1 1 380px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  input[type="file"] {
    font-size: 0.9rem;
    color: var(--text);
  }
  button {
    align-self: flex-start;
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.85rem;
    white-space: pre-wrap;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 4px 0;
  }
  .result-wrap {
    position: relative;
    flex: 1;
    display: flex;
  }
  textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--text);
  }
  .spinner-overlay {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background: rgba(245, 245, 247, 0.7);
    border-radius: 8px;
  }
  .spinner-overlay.visible { display: flex; }
  .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1f1f24;
      --border: #34343b;
      --text: #f0f0f2;
      --muted: #9a9aa2;
      --error-bg: #3a1616;
    }
    .spinner-overlay {
      background: rgba(22, 22, 26, 0.7);
    }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>TCGplayer Price Snap</h1>
    <div class="columns">
      <div class="panel">
        <label for="url">TCGplayer product link</label>
        <input id="url" type="text" placeholder="https://www.tcgplayer.com/product/..." autocomplete="off">
        <button id="snapBtn">Snap</button>
        <div id="error" class="error"></div>

        <hr class="divider">

        <label for="csvFile">Batch upload (CSV or Excel)</label>
        <input id="csvFile" type="file" accept=".csv,.xlsx">
        <button id="snapAllBtn">Snap All</button>
        <div id="batchError" class="error"></div>
        <div id="batchStatus" class="status"></div>
      </div>
      <div class="panel">
        <label for="result">Result</label>
        <div class="result-wrap">
          <textarea id="result" readonly placeholder="Results will appear here..."></textarea>
          <div id="spinnerOverlay" class="spinner-overlay"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const urlInput = document.getElementById('url');
  const snapBtn = document.getElementById('snapBtn');
  const errorBox = document.getElementById('error');
  const resultBox = document.getElementById('result');
  const spinnerOverlay = document.getElementById('spinnerOverlay');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  function clearError() {
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  function setLoading(loading) {
    spinnerOverlay.classList.toggle('visible', loading);
  }

  async function snap() {
    const url = urlInput.value.trim();
    clearError();
    resultBox.value = '';

    if (!url) {
      showError('Please paste a TCGplayer product link.');
      return;
    }

    snapBtn.disabled = true;
    snapBtn.textContent = 'Snapping...';
    setLoading(true);

    try {
      const resp = await fetch('/api/scrape', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      const data = await resp.json();

      if (!resp.ok || !data.ok) {
        showError(data.error || `Request failed (status ${resp.status}).`);
        return;
      }

      resultBox.value = data.text;
    } catch (err) {
      showError('Could not reach the server. Is app.py still running?');
    } finally {
      snapBtn.disabled = false;
      snapBtn.textContent = 'Snap';
      setLoading(false);
    }
  }

  snapBtn.addEventListener('click', snap);
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') snap();
  });

  const fileInput = document.getElementById('csvFile');
  const snapAllBtn = document.getElementById('snapAllBtn');
  const batchError = document.getElementById('batchError');
  const batchStatus = document.getElementById('batchStatus');

  async function snapAll() {
    const file = fileInput.files[0];
    batchError.style.display = 'none';
    batchError.textContent = '';
    batchStatus.textContent = '';

    if (!file) {
      batchError.textContent = 'Please choose a CSV or Excel file first.';
      batchError.style.display = 'block';
      return;
    }

    const formData = new FormData();
    formData.append('file', file);

    snapAllBtn.disabled = true;
    snapAllBtn.textContent = 'Snapping all...';
    setLoading(true);
    batchStatus.textContent = 'Processing rows, this can take a while (~5s per link)...';

    try {
      const resp = await fetch('/api/batch', { method: 'POST', body: formData });
      const contentType = resp.headers.get('Content-Type') || '';

      if (contentType.includes('application/json')) {
        const data = await resp.json();
        batchError.textContent = data.error || `Request failed (status ${resp.status}).`;
        batchError.style.display = 'block';
        batchStatus.textContent = '';
        return;
      }

      if (!resp.ok) {
        batchError.textContent = `Request failed (status ${resp.status}).`;
        batchError.style.display = 'block';
        batchStatus.textContent = '';
        return;
      }

      const blob = await resp.blob();
      let filename = 'snapped_results';
      const disposition = resp.headers.get('Content-Disposition');
      if (disposition) {
        const match = disposition.match(/filename="?([^";]+)"?/);
        if (match) filename = match[1];
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      batchStatus.textContent = `Done — downloaded ${filename}.`;
    } catch (err) {
      batchError.textContent = 'Could not reach the server. Is app.py still running?';
      batchError.style.display = 'block';
      batchStatus.textContent = '';
    } finally {
      snapAllBtn.disabled = false;
      snapAllBtn.textContent = 'Snap All';
      setLoading(false);
    }
  }

  snapAllBtn.addEventListener('click', snapAll);
</script>
</body>
</html>
